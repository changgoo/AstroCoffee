name: Send assignment emails

on:
  workflow_dispatch:
    inputs:
      period:
        description: "Assignment period (for example 2026_3); sends to all assigned hosts"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: send-assignment-emails-${{ inputs.period }}
  cancel-in-progress: false

jobs:
  send-assignment-emails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependency
        run: pip install holidays

      - name: Validate request
        env:
          PERIOD: ${{ inputs.period }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main"
            exit 1
          fi
          if [[ ! "$PERIOD" =~ ^[0-9]{4}_[0-9]+$ ]] || [ ! -f "data/hosts_${PERIOD}.json" ]; then
            echo "::error::Enter an existing assignment period, such as 2026_3"
            exit 1
          fi
          if [ -z "$GMAIL_USER" ] || [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "::error::Gmail secrets are missing"
            exit 1
          fi

      - name: Send through Gmail SMTP
        env:
          PERIOD: ${{ inputs.period }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python src/send_assignment_emails.py "$PERIOD"
